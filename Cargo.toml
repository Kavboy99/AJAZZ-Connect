[package]
name = "lusorium-studio"
version = "0.3.0"
edition = "2024"
description = "Lusorium Studio: configuration and lighting for PC peripherals (SONiX, HID LampArray, OpenRGB SDK)"
license = "MIT"

[features]
default = ["driver-sonix-aa55", "driver-sonix-feature", "driver-hid-lamparray", "driver-openrgb", "driver-by-tech"]
driver-sonix-aa55 = []
driver-sonix-feature = []
driver-hid-lamparray = []
driver-openrgb = []
driver-by-tech = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }
# Built-in device profiles (src/profiles/data/*.toml); parsing only.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
# Mica backdrop behind the navigation pane through DWM (docs/DESIGN.md, section 6).
window-vibrancy = "0.8.1"

[profile.release]
lto = "thin"
strip = true
