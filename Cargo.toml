[package]
name = "ak820max-assistant"
version = "0.2.0"
edition = "2024"
description = "AJAZZ Connect: OpenRGB SDK, HID LampArray and firmware analysis"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[profile.release]
lto = "thin"
strip = true
